<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guía de Comercios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a2e0e6bdae.js" crossorigin="anonymous"></script>
  <style>
    .card:hover { cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .btn-category { margin: 5px; }
    .destacado { border: 2px solid gold; }
  </style>
</head>
<body>

<!-- Header -->
<header class="bg-primary text-white p-3">
  <div class="container d-flex justify-content-between align-items-center flex-wrap">
    <h1><i class="fas fa-store"></i> Guía de Comercios</h1>
    <input id="searchInput" class="form-control w-25" type="text" placeholder="Buscar por rubro...">
  </div>
</header>

<!-- Carrusel -->
<div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="img1.jpg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="img2.jpg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="img3.jpg" class="d-block w-100" alt="...">
    </div>
  </div>
</div>

<!-- Botones de Rubros -->
<div class="container text-center my-4">
  <button class="btn btn-outline-primary btn-category" onclick="filterCards('todos')">Todos</button>
  <button class="btn btn-outline-primary btn-category" onclick="filterCards('comida')">Comida</button>
  <button class="btn btn-outline-success btn-category" onclick="filterCards('ropa')">Ropa</button>
  <button class="btn btn-outline-warning btn-category" onclick="filterCards('servicios')">Servicios</button>
  <button class="btn btn-outline-info btn-category" onclick="filterCards('tecnologia')">Tecnología</button>
  <button class="btn btn-outline-danger btn-category" onclick="filterCards('salud')">Salud</button>
  <button class="btn btn-outline-secondary btn-category" onclick="filterCards('educacion')">Educación</button>
  <button class="btn btn-outline-dark btn-category" onclick="filterCards('belleza')">Belleza</button>
</div>

<!-- 🔥 DESTACADOS -->
<div class="container my-5">
  <h3 class="text-center mb-4">📌 Comercios Destacados</h3>
  <div class="row" id="destacadosContainer">
    <!-- Ejemplo de comercio destacado -->
    <div class="col-md-4 mb-4 card-item comida destacado">
      <div class="card" onclick="showModal('La Casa de la Milanesa', 'Especialidad en milanesas gigantes. Delivery sin cargo.', ['mila1.jpg','mila2.jpg'])">
        <img src="mila1.jpg" class="card-img-top" alt="...">
        <div class="card-body">
          <h5 class="card-title">La Casa de la Milanesa</h5>
          <p class="card-text">Comida casera</p>
        </div>
      </div>
    </div>
    <!-- Agregás más destacados acá si querés -->
  </div>
</div>

<!-- Cards de Comercios -->
<div class="container">
  <div class="row" id="cardsContainer">
    <!-- COMIDA -->
    <div class="col-md-4 mb-4 card-item comida">
      <div class="card" onclick="showModal('Empanadas Doña María', 'Empanadas caseras mendocinas', ['emp1.jpg','emp2.jpg'])">
        <img src="emp1.jpg" class="card-img-top" alt="">
        <div class="card-body"><h5 class="card-title">Empanadas Doña María</h5><p>Comida</p></div>
      </div>
    </div>
    <!-- ROPA -->
    <div class="col-md-4 mb-4 card-item ropa">
      <div class="card" onclick="showModal('UrbanStyle', 'Ropa urbana juvenil', ['ropa1.jpg'])">
        <img src="ropa1.jpg" class="card-img-top" alt="">
        <div class="card-body"><h5 class="card-title">UrbanStyle</h5><p>Ropa</p></div>
      </div>
    </div>
    <!-- SERVICIOS -->
    <div class="col-md-4 mb-4 card-item servicios">
      <div class="card" onclick="showModal('Reparaciones Express', 'Reparación de electrodomésticos', ['serv1.jpg'])">
        <img src="serv1.jpg" class="card-img-top" alt="">
        <div class="card-body"><h5 class="card-title">Reparaciones Express</h5><p>Servicios</p></div>
      </div>
    </div>
    <!-- TECNOLOGÍA -->
    <div class="col-md-4 mb-4 card-item tecnologia">
      <div class="card" onclick="showModal('TechZone', 'Venta de accesorios y computadoras', ['tech1.jpg'])">
        <img src="tech1.jpg" class="card-img-top" alt="">
        <div class="card-body"><h5 class="card-title">TechZone</h5><p>Tecnología</p></div>
      </div>
    </div>
    <!-- SALUD -->
    <div class="col-md-4 mb-4 card-item salud">
      <div class="card" onclick="showModal('Centro Médico Maipú', 'Consultorios y laboratorio', ['salud1.jpg'])">
        <img src="salud1.jpg" class="card-img-top" alt="">
        <div class="card-body"><h5 class="card-title">Centro Médico Maipú</h5><p>Salud</p></div>
      </div>
    </div>
    <!-- EDUCACIÓN -->
    <div class="col-md-4 mb-4 card-item educacion">
      <div class="card" onclick="showModal('Instituto Alfa', 'Cursos de informática y oficios', ['edu1.jpg'])">
        <img src="edu1.jpg" class="card-img-top" alt="">
        <div class="card-body"><h5 class="card-title">Instituto Alfa</h5><p>Educación</p></div>
      </div>
    </div>
    <!-- BELLEZA -->
    <div class="col-md-4 mb-4 card-item belleza">
      <div class="card" onclick="showModal('Spa Natural', 'Masajes y estética', ['spa1.jpg'])">
        <img src="spa1.jpg" class="card-img-top" alt="">
        <div class="card-body"><h5 class="card-title">Spa Natural</h5><p>Belleza</p></div>
      </div>
    </div>
    <!-- AGREGÁ HASTA 15 -->
    <!-- ... seguí agregando duplicando las cards ... -->
  </div>
</div>

<!-- Modal -->
<div class="modal fade" id="comercioModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 id="modalTitle" class="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="modalDesc"></p>
        <div id="modalImages" class="d-flex flex-wrap gap-2"></div>
      </div>
    </div>
  </div>
</div>

<!-- Botón Registrar Comercio -->
<div class="container text-center my-5">
  <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#registroModal">
    Registrar mi comercio
  </button>
</div>

<!-- Modal Registro -->
<div class="modal fade" id="registroModal" tabindex="-1">
  <div class="modal-dialog">
    <form class="modal-content" onsubmit="enviarWhatsApp(event)">
      <div class="modal-header">
        <h5 class="modal-title">Registrar Comercio</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input class="form-control mb-2" placeholder="Nombre del comercio" id="nombre">
        <input class="form-control mb-2" placeholder="Dirección" id="direccion">
        <input class="form-control mb-2" placeholder="Teléfono" id="telefono">
        <textarea class="form-control mb-2" placeholder="Detalles del comercio" id="detalles"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" type="submit">Enviar</button>
      </div>
    </form>
  </div>
</div>

<!-- Scripts -->
<script>
  function filterCards(rubro) {
    const cards = document.querySelectorAll('.card-item');
    cards.forEach(card => {
      if (rubro === 'todos' || card.classList.contains(rubro)) {
        card.style.display = 'block';
      } else {
        card.style.display = 'none';
      }
    });
  }

  function showModal(titulo, descripcion, imagenes) {
    document.getElementById('modalTitle').textContent = titulo;
    document.getElementById('modalDesc').textContent = descripcion;
    const container = document.getElementById('modalImages');
    container.innerHTML = '';
    imagenes.forEach(src => {
      const img = document.createElement('img');
      img.src = src;
      img.width = 150;
      img.className = "rounded";
      container.appendChild(img);
    });
    new bootstrap.Modal(document.getElementById('comercioModal')).show();
  }

  function enviarWhatsApp(e) {
    e.preventDefault();
    const nombre = document.getElementById('nombre').value;
    const direccion = document.getElementById('direccion').value;
    const telefono = document.getElementById('telefono').value;
    const detalles = document.getElementById('detalles').value;
    const mensaje = `¡Hola! Quiero registrar mi comercio:\nNombre: ${nombre}\nDirección: ${direccion}\nTel: ${telefono}\nDetalles: ${detalles}`;
    const url = `https://wa.me/5492616246767?text=${encodeURIComponent(mensaje)}`;
    window.open(url, '_blank');
  }

  document.getElementById('searchInput').addEventListener('input', function () {
    const valor = this.value.toLowerCase();
    document.querySelectorAll('.card-item').forEach(card => {
      const texto = card.innerText.toLowerCase();
      card.style.display = texto.includes(valor) ? 'block' : 'none';
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
